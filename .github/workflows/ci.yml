name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  license:
    uses: oas-ai/.github/.github/workflows/license-check.yml@main
  firmware:
    uses: oas-ai/.github/.github/workflows/cpp-ci.yml@main
    with:
      source-directory: firmware
  rust:
    uses: oas-ai/.github/.github/workflows/rust-ci.yml@main
  socketcan:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oas-ai/ohayessOS
          ref: 917d71827b2dcff3539219f25c9ca08ef566424e
          path: ohayessOS
      - uses: actions/checkout@v4
        with:
          repository: oas-ai/sdk
          ref: 0e013d24a08dea09a5be607285bf5b3eaf946d27
          path: sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash -n scripts/preflight-linux.sh
      - run: sudo apt-get update && sudo apt-get install -y can-utils "linux-modules-extra-$(uname -r)" cmake g++ libprotobuf-dev protobuf-compiler qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - run: sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set vcan0 up
      - run: cargo test --test socketcan_vcan -- --ignored
      - run: cargo build -p oas-gateway-host
      - run: cargo build --manifest-path ohayessOS/Cargo.toml -p ohayess-runtime -p ohayess-viewer
      - run: ./scripts/e2e-vcan.sh target/debug/ohayess-runtime
      - run: ./scripts/e2e-recovery-vcan.sh target/debug/ohayess-runtime
      - run: ./scripts/e2e-hmi-state-vcan.sh target/debug/ohayess-runtime target/debug/hmi_state_probe
      - run: cmake -S ohayessOS/apps/hmi -B target/qt-hmi -DOAS_SDK_PROTO_DIR="$GITHUB_WORKSPACE/sdk/proto" && cmake --build target/qt-hmi --parallel
      - run: bash scripts/e2e-qt-hmi-vcan.sh target/debug/ohayess-runtime target/qt-hmi/ohayess-hmi
      - run: google-chrome --version
      - run: ./scripts/e2e-viewer-recovery-vcan.sh target/debug/ohayess-runtime target/debug/ohayess-viewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcan-qt-hmi
          path: target/hmi-artifacts/*.png
