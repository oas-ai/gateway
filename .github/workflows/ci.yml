name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  license:
    uses: oas-ai/.github/.github/workflows/license-check.yml@main
  firmware:
    uses: oas-ai/.github/.github/workflows/cpp-ci.yml@main
    with:
      source-directory: firmware
  rust:
    uses: oas-ai/.github/.github/workflows/rust-ci.yml@main
  socketcan:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oas-ai/ohayessOS
          ref: ef8d0e1bf170b90d7fe06cb9db38c0da825237f0
          path: ohayessOS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash -n scripts/preflight-linux.sh
      - run: sudo apt-get update && sudo apt-get install -y can-utils "linux-modules-extra-$(uname -r)"
      - run: sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set vcan0 up
      - run: cargo test --test socketcan_vcan -- --ignored
      - run: cargo build -p oas-gateway-host
      - run: cargo build --manifest-path ohayessOS/Cargo.toml -p ohayess-runtime -p ohayess-viewer
      - run: ./scripts/e2e-vcan.sh target/debug/ohayess-runtime
      - run: ./scripts/e2e-recovery-vcan.sh target/debug/ohayess-runtime
      - run: google-chrome --version
      - run: ./scripts/e2e-viewer-recovery-vcan.sh target/debug/ohayess-runtime target/debug/ohayess-viewer
