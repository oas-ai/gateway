[package]
name = "oas-gateway-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read-only OAS CAN gateway host pipeline"

[lib]
path = "src/lib.rs"

[dependencies]
oas-can = { git = "https://github.com/oas-ai/can.git", rev = "c9c44b452be3aa53fd132520896bbf1ab4ae2e54" }
oas-car = { git = "https://github.com/oas-ai/car.git", rev = "1a50db026ac4be72f3dca859fa8b5f8d7aff7043" }
oas-sdk = { git = "https://github.com/oas-ai/sdk.git", rev = "5f536c640a15c1d4b31749a467fa9d86919c9d1b" }
prost = "0.14.4"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "4.0.0"

[dev-dependencies]
serde_json = "1.0"
