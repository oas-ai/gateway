[package]
name = "oas-gateway-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read-only OAS CAN gateway host pipeline"

[lib]
path = "src/lib.rs"

[dependencies]
oas-can = { git = "https://github.com/oas-ai/can.git", rev = "f6a7c432e7b1cccf098fa9ef9142eea314cd38a9" }
oas-car = { git = "https://github.com/oas-ai/car.git", rev = "a4dd5ee45f60871f353f5c1cfbcdc5441bfa1cfb" }
oas-sdk = { git = "https://github.com/oas-ai/sdk.git", rev = "a7e1777a3df0ba0a27d38f772db09771cb5724df" }
prost = "0.14.4"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "4.0.0"

[dev-dependencies]
serde_json = "1.0"
