[package]
name = "oas-gateway-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read-only OAS CAN gateway host pipeline"

[lib]
path = "src/lib.rs"

[dependencies]
oas-can = { git = "https://github.com/oas-ai/can.git", rev = "0de3e86d5ade1d68b035cb2f6eb19141c68ccdac" }
oas-car = { git = "https://github.com/oas-ai/car.git", rev = "c10fe0271d99bb99b21f7611982c814e77e16888" }
oas-sdk = { git = "https://github.com/oas-ai/sdk.git", rev = "1798c5efab35231b93fef0f4c3e69af962e89201" }
prost = "0.14.4"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "4.0.0"

[dev-dependencies]
serde_json = "1.0"
