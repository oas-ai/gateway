[package]
name = "oas-gateway-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read-only OAS CAN gateway host pipeline"

[lib]
path = "src/lib.rs"

[dependencies]
oas-can = { git = "https://github.com/oas-ai/can.git", rev = "91945a08e49c431c5f3e3c8055790be8e06b144d" }
oas-car = { git = "https://github.com/oas-ai/car.git", rev = "2e73c0d91085fbc568ddc0f73dcaf18868a49ff2" }
oas-sdk = { git = "https://github.com/oas-ai/sdk.git", rev = "a7e1777a3df0ba0a27d38f772db09771cb5724df" }
prost = "0.14.4"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "4.0.0"

[dev-dependencies]
serde_json = "1.0"
